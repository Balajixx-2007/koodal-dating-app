name: Supabase CI Test Suite

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database-tests:
    name: Supabase Start & Database pgTAP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local instance
        run: supabase start --debug

      - name: Run Supabase pgTAP database tests
        run: supabase test db

      - name: Run Vitest database & formula tests
        run: npm test

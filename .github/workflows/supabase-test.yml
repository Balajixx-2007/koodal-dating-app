name: Supabase CI Test Suite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  database-tests:
    name: Supabase Start & Database pgTAP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stop host PostgreSQL if running
        run: sudo systemctl stop postgresql || true

      - name: Start Supabase local instance
        run: |
          supabase start

      - name: Run Supabase pgTAP database tests
        run: |
          echo "=== 1. Supabase CLI test db ==="
          supabase test db 2>&1 | tee pg_tap_summary.txt
          echo "=== 2. pg_prove Verbose TAP Stream (1..N) ==="
          docker run --network host -e PGPASSWORD=postgres -v ${{ github.workspace }}/supabase/tests:/tests public.ecr.aws/supabase/pg_prove:3.36 -v -h 127.0.0.1 -p 54322 -U postgres -d postgres /tests/database_security_and_admissions.sql 2>&1 | tee pg_tap_output.txt

      - name: Run Vitest database & formula tests
        run: npm test

      - name: Publish execution logs to repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p ci-artifacts
          cp pg_tap_output.txt ci-artifacts/pg_tap_output.txt || true
          cp pg_tap_summary.txt ci-artifacts/pg_tap_summary.txt || true
          git add ci-artifacts/
          git commit -m "ci: publish latest pgTAP test results [skip ci]" || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:refs/heads/ci-logs --force

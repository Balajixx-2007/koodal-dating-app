name: Supabase CI Test Suite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  database-tests:
    name: Supabase Start & Database pgTAP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stop host PostgreSQL if running
        run: sudo systemctl stop postgresql || true

      - name: Start Supabase local instance
        run: |
          supabase start 2>&1 | tee supabase_start.log

      - name: Run Supabase pgTAP database tests
        run: |
          supabase test db 2>&1 | tee supabase_test.log

      - name: Run Vitest database & formula tests
        run: npm test

      - name: Commit CI log output
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p ci-artifacts
          cp supabase_start.log ci-artifacts/supabase_start.txt || true
          cp supabase_test.log ci-artifacts/supabase_test.txt || true
          git add ci-artifacts/
          git commit -m "ci: record raw supabase start and test db execution logs [skip ci]" || true
          git push origin ci-logs --force

name: Supabase CI Test Suite

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database-tests:
    name: Supabase Start & Database pgTAP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stop host PostgreSQL if running
        run: sudo systemctl stop postgresql || true

      - name: Start Supabase local instance
        run: |
          supabase start 2>&1 | tee supabase_start.log

      - name: Run Supabase pgTAP database tests
        run: |
          supabase test db 2>&1 | tee supabase_test.log

      - name: Run Vitest database & formula tests
        run: npm test

      - name: Upload Supabase execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-execution-logs
          path: |
            supabase_start.log
            supabase_test.log

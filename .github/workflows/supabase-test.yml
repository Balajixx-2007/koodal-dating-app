name: Supabase Database Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-database:
    name: Run pgTAP & Admission Formula Suite
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stop host PostgreSQL if running
        run: sudo systemctl stop postgresql || true

      - name: Start Supabase local instance (Pre-Step 1.5 baseline)
        run: |
          # Temporarily hold migration 11 to boot Supabase at baseline with migrations 1 to 10
          if [ -f supabase/migrations/20261024000011_step1_5_fix_read_functions.sql ]; then
            mv supabase/migrations/20261024000011_step1_5_fix_read_functions.sql supabase/migrations/20261024000011_step1_5_fix_read_functions.sql.pending
          fi
          supabase start

      - name: Run Supabase pgTAP database tests (Red and Green runs)
        run: |
          CONTAINER_ID=$(docker ps --filter "name=supabase_db_" --format "{{.ID}}")
          > pg_tap_output.txt

          echo "=== 1. RED STATE TAP OUTPUT (Step 1.5 tests before migration 11) ===" | tee -a pg_tap_output.txt
          docker exec -i "$CONTAINER_ID" psql -U postgres -d postgres -X -q -t -A < supabase/tests/step1_5_read_functions.sql 2>&1 | tee -a pg_tap_output.txt || true

          # Restore and apply Step 1.5 migration 11
          if [ -f supabase/migrations/20261024000011_step1_5_fix_read_functions.sql.pending ]; then
            mv supabase/migrations/20261024000011_step1_5_fix_read_functions.sql.pending supabase/migrations/20261024000011_step1_5_fix_read_functions.sql
            docker exec -i "$CONTAINER_ID" psql -U postgres -d postgres -X -q < supabase/migrations/20261024000011_step1_5_fix_read_functions.sql
          fi

          echo "" | tee -a pg_tap_output.txt
          echo "=== 2. GREEN STATE TAP OUTPUT (Step 1.5 tests after migration 11) ===" | tee -a pg_tap_output.txt
          docker exec -i "$CONTAINER_ID" psql -U postgres -d postgres -X -q -t -A < supabase/tests/step1_5_read_functions.sql 2>&1 | tee -a pg_tap_output.txt

          echo "" | tee -a pg_tap_output.txt
          echo "=== 3. Supabase CLI test db (Full Suite: Phase 2 + Phase 3 + Step 1.5) ===" | tee -a pg_tap_output.txt
          supabase test db 2>&1 | tee -a pg_tap_output.txt

      - name: Run Vitest test suite
        run: npm test

      - name: Type check and production build
        run: npm run build

      - name: Publish execution logs to repository
        if: always()
        run: |
          cp pg_tap_output.txt /tmp/pg_tap_output.txt || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -f ci-logs || git checkout -b ci-logs
          mkdir -p ci-artifacts
          cp /tmp/pg_tap_output.txt ci-artifacts/pg_tap_output.txt || true
          git add -A ci-artifacts/
          git commit -m "ci: publish latest pgTAP test results [skip ci]" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs --force
